<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Sorpresa 😈</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#pantalla{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#fondo{
    position:absolute;
    inset:-100px;
    display:flex;
    flex-wrap:wrap;
    align-content:center;
    justify-content:center;
    gap:25px;
    transform:rotate(-15deg) scale(1.3);
    opacity:.28;
}

#fondo span{
    color:#ff1744;
    font-size:35px;
    font-weight:900;
    white-space:nowrap;
}

#mensaje{
    position:relative;
    z-index:5;
    color:white;
    text-align:center;
    font-size:clamp(38px,10vw,85px);
    font-weight:900;
    text-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 50px red;
    animation:temblar .08s infinite;
    display:none;
}

#boton{
    position:relative;
    z-index:20;
    border:3px solid #ff1744;
    border-radius:15px;
    background:#111;
    color:white;
    padding:20px 35px;
    font-size:22px;
    font-weight:900;
    box-shadow:
        0 0 15px red,
        0 0 35px red;
    cursor:pointer;
}

#boton:active{
    transform:scale(.92);
}

#aviso{
    position:absolute;
    bottom:20px;
    color:white;
    z-index:10;
    font-size:15px;
    opacity:.7;
    display:none;
}

@keyframes temblar{
    0%{
        transform:translate(2px,1px);
    }

    25%{
        transform:translate(-2px,-1px);
    }

    50%{
        transform:translate(1px,-2px);
    }

    75%{
        transform:translate(-1px,2px);
    }

    100%{
        transform:translate(2px,-1px);
    }
}
</style>
</head>

<body>

<div id="pantalla">

    <div id="fondo"></div>

    <div id="mensaje">
        DIEGO ES GAY<br>
        Y LUIS LO AGARRÓ 💀
    </div>

    <button id="boton">
        🔊 VISTA PREVIA
    </button>

    <div id="aviso">
        😈 ESPERA...
    </div>

</div>

<script>

const fondo = document.getElementById("fondo");
const boton = document.getElementById("boton");
const mensaje = document.getElementById("mensaje");
const aviso = document.getElementById("aviso");

let audioContext = null;
let intervaloBocina = null;
let intervaloVoz = null;
let iniciado = false;


/* ==========================================
   TEXTO DEL FONDO
========================================== */

for(let i = 0; i < 60; i++){

    const texto = document.createElement("span");

    texto.textContent = "DIEGO ES GAY";

    fondo.appendChild(texto);
}


/* ==========================================
   BOTÓN DE VISTA PREVIA
========================================== */

boton.addEventListener("click", iniciar);


/* ==========================================
   INICIAR
========================================== */

function iniciar(){

    if(iniciado) return;

    iniciado = true;

    boton.style.display = "none";

    mensaje.style.display = "block";

    aviso.style.display = "block";

    aviso.textContent = "💀 JAJAJA";


    /* Pantalla completa */

    try{

        if(document.documentElement.requestFullscreen){

            document.documentElement.requestFullscreen();

        }

    }catch(e){}


    /* Vibración */

    try{

        if(navigator.vibrate){

            navigator.vibrate([
                250,
                80,
                250,
                80,
                500
            ]);

        }

    }catch(e){}


    /* ======================================
       AUDIO
    ====================================== */

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(AudioContext){

        audioContext = new AudioContext();

        if(audioContext.state === "suspended"){

            audioContext.resume();

        }

        /* Bocina inmediata */

        bocina();

        /* Bocina muy rápida */

        intervaloBocina = setInterval(
            bocina,
            500
        );
    }


    /* ======================================
       VOZ
    ====================================== */

    decirDiego();

    intervaloVoz = setInterval(
        decirDiego,
        1300
    );


    /* ======================================
       60 SEGUNDOS
    ====================================== */

    setTimeout(() => {

        clearInterval(intervaloBocina);
        clearInterval(intervaloVoz);

        if("speechSynthesis" in window){

            speechSynthesis.cancel();

        }

        if(audioContext){

            try{

                audioContext.close();

            }catch(e){}

        }

        aviso.textContent = "😈 FIN DE LA BROMA";

        try{

            if(document.fullscreenElement){

                document.exitFullscreen();

            }

        }catch(e){}

    },60000);

}


/* ==========================================
   BOCINA RÁPIDA
========================================== */

function bocina(){

    if(!audioContext) return;

    const ahora = audioContext.currentTime;

    /* 3 bocinazos rápidos */

    for(let i = 0; i < 3; i++){

        const inicio =
            ahora + (i * 0.13);

        const osc1 =
            audioContext.createOscillator();

        const osc2 =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        osc1.type = "sawtooth";
        osc2.type = "square";


        /* Frecuencia de bocina */

        osc1.frequency.setValueAtTime(
            190,
            inicio
        );

        osc2.frequency.setValueAtTime(
            380,
            inicio
        );


        /* Golpe rápido */

        gain.gain.setValueAtTime(
            0.001,
            inicio
        );

        gain.gain.exponentialRampToValueAtTime(
            0.55,
            inicio + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            inicio + 0.11
        );


        osc1.connect(gain);
        osc2.connect(gain);

        gain.connect(
            audioContext.destination
        );


        osc1.start(inicio);
        osc2.start(inicio);

        osc1.stop(inicio + 0.12);
        osc2.stop(inicio + 0.12);
    }

}


/* ==========================================
   VOZ
========================================== */

function decirDiego(){

    if(!("speechSynthesis" in window)){

        return;

    }

    speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(
            "DIEGO ES GAY"
        );

    voz.lang = "es-ES";

    voz.rate = 2.2;

    voz.pitch = 1.15;

    voz.volume = 1;

    speechSynthesis.speak(voz);

}

</script>

</body>
</html>
