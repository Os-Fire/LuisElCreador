<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>😈 Sorpresa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #susto {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: white;
      text-align: center;
    }

    #fondo {
      position: absolute;
      inset: -100px;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 25px;
      transform: rotate(-15deg) scale(1.3);
      opacity: 0.3;
    }

    #fondo span {
      color: #ff1744;
      font-size: 35px;
      font-weight: 900;
      white-space: nowrap;
    }

    #mensaje {
      position: relative;
      z-index: 5;
      padding: 25px;
      font-size: clamp(35px, 10vw, 80px);
      font-weight: 900;
      text-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 50px red;
      animation: temblar 0.08s infinite;
    }

    #aviso {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      font-size: 18px;
      opacity: 0.8;
    }

    @keyframes temblar {
      0%   { transform: translate(2px, 1px); }
      25%  { transform: translate(-2px, -1px); }
      50%  { transform: translate(1px, -2px); }
      75%  { transform: translate(-1px, 2px); }
      100% { transform: translate(2px, -1px); }
    }
  </style>
</head>

<body>

  <div id="susto">

    <div id="fondo"></div>

    <div id="mensaje">
      DIEGO ES GAY<br>
      Y LUIS LO AGARRÓ 💀
    </div>

    <div id="aviso">
      🔊 Toca la pantalla
    </div>

  </div>

  <script>
    const fondo = document.getElementById("fondo");

    // Fondo repetido
    for (let i = 0; i < 50; i++) {
      const texto = document.createElement("span");
      texto.textContent = "DIEGO ES GAY";
      fondo.appendChild(texto);
    }

    let sonidoIniciado = false;

    document.body.addEventListener("click", iniciarSonido);
    document.body.addEventListener("touchstart", iniciarSonido, {
      passive: true
    });

    async function iniciarSonido() {

      if (sonidoIniciado) return;
      sonidoIniciado = true;

      // Pantalla completa si el navegador lo permite
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}

      // Vibración
      if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500, 200, 1000]);
      }

      // Sonido tipo bocina
      const AudioContext =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) return;

      const audio = new AudioContext();

      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.type = "sawtooth";
      oscillator.frequency.value = 120;

      gain.gain.value = 0.12;

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start();

      const cambio = setInterval(() => {
        oscillator.frequency.value =
          100 + Math.random() * 80;
      }, 150);

      // 60 segundos
      setTimeout(() => {
        clearInterval(cambio);

        try {
          oscillator.stop();
        } catch (e) {}

        audio.close();

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }

        document.getElementById("aviso").textContent =
          "😈 Fin de la broma";
      }, 60000);
    }
  </script>

</body>
</html>
